<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הקישורים של Krav0n</title>
    <!-- טעינת אייקונים של FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0014; /* רקע כהה מאוד כמו בתמונה */
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 25vh; /* דוחף את כל התוכן למטה בערך ב-60 אחוז מהמסך */
        }

        /* עיצוב תמונת פרופיל חלק */
        .profile-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px; /* רווח קבוע בין כפתורים */
        }

        /* סגנון כללי לכפתורים בדיוק כמו בתמונה */
        .link-card {
            border-radius: 14px; /* פינות מעוגלות רחבות */
            padding: 18px;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* רווח בין הטקסט לאייקון */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .link-card:hover {
            transform: scale(1.02); /* הגדלה קלה ברחיפה */
            opacity: 0.92;
        }

        /* צבעים ורקעים ייחודיים לכל כפתור לפי התמונה */
        .btn-youtube {
            background: linear-gradient(to right, #ba0000, #e60000);
        }

        .btn-kick {
            background-color: #53fc18;
            color: #000000; /* טקסט שחור ב-Kick לניגודיות */
        }

        .btn-instagram {
            background: linear-gradient(45deg, #8a3ab9, #e95950, #fccc63);
        }

        .btn-discord {
            background: linear-gradient(to right, #4051b5, #5865f2);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- תמונת פרופיל לחיצה שמובילה לקיק שלכם -->
        <a href="https://kick.com" target="_blank" class="profile-link">
            <img src="https://placeholder.com" alt="Krav0n" class="profile-img">
        </a>

        <!-- רשימת הכפתורים המעודכנת עם הקישורים שלכם -->
        <div class="links-container">
            
            <!-- כפתור YouTube -->
            <a href="https://youtube.com" target="_blank" class="link-card btn-youtube">
                YouTube <i class="fab fa-youtube"></i>
            </a>

            <!-- כפתור Kick -->
            <a href="https://kick.com" target="_blank" class="link-card btn-kick">
                Kick <i class="fa-solid fa-k"></i>
            </a>

            <!-- כפתור Instagram -->
            <a href="https://instagram.com" target="_blank" class="link-card btn-instagram">
                Instagram <i class="fab fa-instagram"></i>
            </a>

            <!-- כפתור Discord -->
            <a href="https://discord.com" target="_blank" class="link-card btn-discord">
                Discord <i class="fab fa-discord"></i>
            </a>

        </div>

    </div>

</body>
</html>
