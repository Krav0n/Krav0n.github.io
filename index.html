<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krav0n Links</title>
    <!-- ייבוא FontAwesome עבור סמלים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

        :root {
            /* רקע בהיר יותר ב-20% מהמקור */
            --bg-color: #2b233d; 
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0 60px 0; /* מרווח פנימי שמונע חפיפה עם הקרדיט למטה */
            box-sizing: border-box;
            transition: background-color 0.3s ease, filter 0.3s ease;
            position: relative;
            overflow-x: hidden;
            
            /* שילוב דמות הילד ישירות כרקע בצד ימין */
            background-image: url('https://github.com/Krav0n/Krav0n.github.io/blob/main/1.png?raw=true');
            background-repeat: no-repeat;
            background-position: right bottom; 
            background-attachment: fixed;
            background-size: 450px; 
        }

        /* אפקט תאורה לעכבר (קטן, 5% בהירות, ואנימציית ברקים) */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            /* שינוי ל-0.05 לבהירות של 5%, והקטנת הרדיוס ל-80px שיהיה קטן */
            background: radial-gradient(circle at var(--x, 50vw) var(--y, 50vh), rgba(255, 255, 255, 0.05) 0%, transparent 80px);
            z-index: 0;
            /* אנימציה של הבהובים (ברקים) */
            animation: lightningFlicker 2s infinite;
        }

        /* אנימציית הברקים להבהוב של הספוטלייט */
        @keyframes lightningFlicker {
            0%, 94%, 100% { opacity: 1; }
            95% { opacity: 1.8; }
            96% { opacity: 0.4; }
            97% { opacity: 2.2; }
            98% { opacity: 0.6; }
            99% { opacity: 1.5; }
        }

        @media (max-width: 768px) {
            body {
                background-position: right bottom; 
                background-size: 180px; 
            }
        }

        /* תמונת פרופיל + שם, עם מרווח שדוחף את הכפתורים למטה */
        .profile-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15vh; /* מוריד את הכפתורים למטה */
            z-index: 1;
        }
        
        .profile-name {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #facc15, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }

        .footer-credit {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #ffffff;
            z-index: 10;
            opacity: 0.8;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #555;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1;
        }

        .link-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, filter 0.2s;
            box-sizing: border-box;
            border: 2px solid transparent; 
        }

        .link-btn:hover, .link-btn:focus {
            transform: scale(1.04);
            filter: brightness(1.15);
            outline: none;
        }

        .btn-kick { background-color: #53fc18; color: #000000; }
        .btn-discord { background-color: #5865F2; color: #ffffff; }
        .btn-youtube { background-color: #FF0000; color: #ffffff; }
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
        }

        /* כפתור נגישות */

        }

        .accessibility-btn:hover { transform: scale(1.1); }

        .accessibility-menu {
            position: fixed;
            bottom: 90px;
            left: 20px;
            background-color: #ffffff;
            color: #333;
            border-radius: 8px;
            width: 320px;
            display: none;
            flex-direction: column;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .accessibility-menu.active { display: flex; }

        .acc-header {
            background-color: #e50000;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .acc-header button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .acc-content {
            padding: 15px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .acc-section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .acc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        .acc-item {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 13px;
            color: #555;
        }

        .acc-item i { font-size: 24px; color: #e50000; }
        .acc-item:hover, .acc-item.active {
            background-color: #fff5f5;
            border-color: #e50000;
            color: #e50000;
        }

        /* מחלקות שינוי מצב נגישות */
        body.grayscale { filter: grayscale(100%); }
        body.high-contrast-mode { --bg-color: #000000; --text-color: #ffff00; }
        body.high-contrast-mode .link-btn { border: 2px solid yellow; }
        body.light-contrast-mode { --bg-color: #ffffff; --text-color: #000000; }
        body.large-text-mode { font-size: 1.2em; }
        body.large-text-mode .link-btn { font-size: 1.1em; }

        /* אפקט ברקים שמיוצר בקוד (Canvas) רק מסביב למסך */
        #lightningCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2; /* מאחורי הכל */
            pointer-events: none;
            /* מסכה שקופה באמצע כדי שהברקים לא יגעו בטקסט ובתמונות */
            -webkit-mask-image: radial-gradient(ellipse at center, transparent 35%, black 75%);
            mask-image: radial-gradient(ellipse at center, transparent 35%, black 75%);
        }
    </style>

    <!-- כפתור נגישות -->
    <button class="accessibility-btn" id="accBtn" aria-label="תפריט נגישות">
        <i class="fa-solid fa-universal-access"></i>
    </button>

    <!-- תפריט נגישות -->
    <div class="accessibility-menu" id="accMenu">
        <div class="acc-header">
            <span>תפריט נגישות</span>
            <button id="closeAccBtn">&times;</button>
        </div>
        <div class="acc-content">
            <div class="acc-section-title">התאמות ניגודיות</div>
            <div class="acc-grid">
                <div class="acc-item" id="contrastDark"><i class="fa-solid fa-moon"></i>ניגודיות כהה</div>
                <div class="acc-item" id="contrastLight"><i class="fa-solid fa-sun"></i>ניגודיות בהירה</div>
                <div class="acc-item" id="contrastGray"><i class="fa-solid fa-eye-dropper"></i>מונוכרום</div>
            </div>
            <div class="acc-section-title">הגדלת הטקסט והגופן</div>
            <div class="acc-grid">
                <div class="acc-item" id="textLarge"><i class="fa-solid fa-text-height"></i>הגדלת טקסט</div>
                <div class="acc-item" id="accReset"><i class="fa-solid fa-arrow-rotate-left"></i>איפוס הגדרות</div>
            </div>
        </div>
    </div>

    <script>
        // === אפקט ברקים בקוד (Canvas) ===
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawBolt(startX, startY, length, angle, branchProbability, depth) {
            if (depth > 3) return; // לא לפצל יותר מדי
            
            let currentX = startX;
            let currentY = startY;
            
            ctx.beginPath();
            ctx.moveTo(currentX, currentY);
            
            // סגנון הברק (צהוב זוהר)
            ctx.shadowBlur = depth === 0 ? 15 : 5;
            ctx.shadowColor = "#facc15";
            ctx.strokeStyle = `rgba(255, 255, 255, ${1 - depth * 0.2})`;
            ctx.lineWidth = Math.max(1, 3 - depth);
            
            let segments = Math.floor(length / 10);
            for (let i = 0; i < segments; i++) {
                // תנועה אקראית בכיוון הכללי
                let segmentAngle = angle + (Math.random() - 0.5) * 1.5;
                currentX += Math.cos(segmentAngle) * 10;
                currentY += Math.sin(segmentAngle) * 10;
                ctx.lineTo(currentX, currentY);
                
                // פיצול ענפים (ברקים קטנים יותר)
                if (Math.random() < branchProbability) {
                    let newAngle = angle + (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
                    drawBolt(currentX, currentY, length * 0.5, newAngle, branchProbability * 0.5, depth + 1);
                    ctx.moveTo(currentX, currentY);
                }
            }
            ctx.stroke();
        }

        function strike() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // התחלה אקראית מהקצוות
            let startX, startY, angle;
            const edge = Math.random();
            if (edge < 0.25) { // למעלה
                startX = Math.random() * canvas.width; startY = 0; angle = Math.PI / 2;
            } else if (edge < 0.5) { // ימין
                startX = canvas.width; startY = Math.random() * canvas.height; angle = Math.PI;
            } else if (edge < 0.75) { // למטה
                startX = Math.random() * canvas.width; startY = canvas.height; angle = -Math.PI / 2;
            } else { // שמאל
                startX = 0; startY = Math.random() * canvas.height; angle = 0;
            }
            
            // כיוון כללי למרכז המסך
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            angle = Math.atan2(centerY - startY, centerX - startX) + (Math.random() - 0.5) * 0.5;

            // ציור הברק
            drawBolt(startX, startY, canvas.height * 0.6, angle, 0.1, 0);
            
            // אפקט פלאש חלש על כל המסך (מוסתר במרכז על ידי המסכה)
            ctx.fillStyle = "rgba(255, 255, 150, 0.03)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // ניקוי המסך מהר כדי לדמות הבהוב
            setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // סיכוי להבהוב כפול
                if (Math.random() < 0.3) {
                    setTimeout(strike, 50 + Math.random() * 100);
                    return;
                }
                
                // תזמון הברק הבא
                setTimeout(strike, 2000 + Math.random() * 6000);
            }, 100);
        }
        
        // התחלת האפקט
        setTimeout(strike, 1500);

        // === אפקט ספוטלייט עוקב עכבר ===
        const spotlight = document.getElementById('spotlight');
        document.addEventListener('mousemove', (e) => {
            spotlight.style.setProperty('--x', `${e.clientX}px`);
            spotlight.style.setProperty('--y', `${e.clientY}px`);
        });

        // פתיחה וסגירה של תפריט נגישות
        const accBtn = document.getElementById('accBtn');
        const accMenu = document.getElementById('accMenu');
        const closeAccBtn = document.getElementById('closeAccBtn');

        accBtn.addEventListener('click', () => accMenu.classList.toggle('active'));
        closeAccBtn.addEventListener('click', () => accMenu.classList.remove('active'));

        // --- הוספת הפונקציונליות לכפתורי הנגישות ---
        const body = document.body;

        function clearActiveButtons() {
            document.querySelectorAll('.acc-item').forEach(btn => btn.classList.remove('active'));
        }

        document.getElementById('contrastDark').addEventListener('click', function() {
            body.className = '';
            body.classList.add('high-contrast-mode');
            clearActiveButtons();
            this.classList.add('active');
        });

        document.getElementById('contrastLight').addEventListener('click', function() {
            body.className = '';
            body.classList.add('light-contrast-mode');
            clearActiveButtons();
            this.classList.add('active');
        });

        document.getElementById('contrastGray').addEventListener('click', function() {
            body.className = '';
            body.classList.add('grayscale');
            clearActiveButtons();
            this.classList.add('active');
        });

        document.getElementById('textLarge').addEventListener('click', function() {
            body.classList.toggle('large-text-mode');
            this.classList.toggle('active');
        });

        document.getElementById('accReset').addEventListener('click', function() {
            body.className = '';
            clearActiveButtons();
        });
    </script>
</body>
