<!-- תפריט נגישות מלא - גרסה יציבה ומתוקנת 100% -->
<style>
  /* ==================== ACCESSIBILITY WIDGET STYLES ==================== */
  #a11y-widget-container { position: fixed !important; bottom: 80px !important; left: 0 !important; z-index: 999998 !important; direction: rtl !important; }
  #a11y-fab { width: 52px !important; height: 52px !important; background: #e02020 !important; color: white !important; border: none !important; border-radius: 0 10px 10px 0 !important; cursor: pointer !important; display: flex !important; align-items: center !important; justify-content: center !important; box-shadow: 3px 3px 15px rgba(0,0,0,0.4) !important; transition: all 0.2s !important; }
  #a11y-fab:hover { background: #c01010 !important; width: 58px !important; }
  
  #a11y-panel { position: fixed !important; bottom: 0 !important; left: -430px !important; top: 0 !important; width: 420px !important; max-width: 95vw !important; background: #ffffff !important; color: #222222 !important; z-index: 999999 !important; transition: left 0.3s ease-in-out !important; overflow-y: auto !important; box-shadow: 5px 0 30px rgba(0,0,0,0.5) !important; display: flex !important; flex-direction: column !important; }
  
  /* דחיפה החוצה כאשר הפאנל פתוח */
  #a11y-panel.open { left: 0px !important; }
  
  #a11y-panel-header { background: #e02020 !important; color: white !important; padding: 16px 20px !important; display: flex !important; align-items: center !important; justify-content: space-between !important; position: sticky !important; top: 0 !important; z-index: 2 !important; flex-shrink: 0 !important; }
  #a11y-panel-header h2 { font-size: 17px !important; font-weight: 900 !important; margin: 0 !important; direction: rtl !important; color: white !important; }
  #a11y-close { background: none !important; border: none !important; color: white !important; cursor: pointer !important; padding: 4px !important; border-radius: 6px !important; display: flex !important; align-items: center !important; }
  #a11y-close:hover { background: rgba(255,255,255,0.2) !important; }
  .a11y-section { padding: 14px 16px 8px !important; text-align: right !important; }
  .a11y-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; margin-top: 10px !important; }
  
  .a11y-btn { background: #ffffff !important; border: 1.5px solid #dddddd !important; border-radius: 10px !important; padding: 12px 6px 8px !important; display: flex !important; flex-direction: column !important; align-items: center !important; gap: 6px !important; cursor: pointer !important; font-size: 12px !important; color: #333333 !important; font-weight: 700 !important; text-align: center !important; font-family: sans-serif !important; line-height: 1.3 !important; min-height: 70px !important; justify-content: center !important; width: 100% !important; }
  .a11y-btn:hover { border-color: #e02020 !important; color: #e02020 !important; background: #fff5f5 !important; }
  .a11y-btn.active { border-color: #e02020 !important; background: #fff0f0 !important; color: #e02020 !important; box-shadow: 0 0 0 2px rgba(224,32,32,0.2) !important; }
  
  #reading-guide-bar { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; height: 40px !important; background: rgba(0,0,0,0.3) !important; pointer-events: none !important; z-index: 99990 !important; display: none; border-top: 2px solid #e02020 !important; border-bottom: 2px solid #e02020 !important; }
  .a11y-slider-row { display: flex !important; align-items: center !important; gap: 10px !important; direction: rtl !important; padding: 8px 0 !important; }
  .a11y-slider-row input[type=range] { flex: 1 !important; accent-color: #e02020 !important; }
  .a11y-slider-label { font-size: 12px !important; font-weight: 700 !important; color: #555555 !important; white-space: nowrap !important; }

  /* BODY MODIFIERS */
  body.a11y-stop-anim * { animation: none !important; transition: none !important; }
  body.a11y-large-text { font-size: 120% !important; }
  body.a11y-high-contrast { filter: contrast(150%) brightness(1.1) !important; }
  body.a11y-dark-contrast { filter: invert(1) hue-rotate(180deg) !important; }
  body.a11y-mono { filter: grayscale(1) !important; }
  body.a11y-highlight-links a { background: yellow !important; color: #000000 !important; padding: 0 2px !important; outline: 2px solid orange !important; }
  body.a11y-readable-font * { font-family: 'Arial', sans-serif !important; letter-spacing: 0.05em !important; }
  body.a11y-big-cursor * { cursor: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='32' height='32' viewBox='0 0 32 32'%3E%3Cpath d='M8 0 L8 24 L14 18 L20 32 L23 31 L17 17 L26 17 Z' fill='black' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E") 8 0, auto !important; }
  .a11y-focus-visible :focus { outline: 3px solid #e02020 !important; outline-offset: 3px !important; }
</style>

<!-- HTML Structure -->
<div id="a11y-widget-container" role="region" aria-label="תפריט נגישות">
  <button id="a11y-fab" aria-label="פתח תפריט נגישות" aria-expanded="false" aria-controls="a11y-panel">
    <svg xmlns="http://w3.org" width="28" height="28" fill="white" viewBox="0 0 256 256" aria-hidden="true">
      <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM128,56a16,16,0,1,0,16,16A16,16,0,0,0,128,56Zm40,56a8,8,0,0,1-8,8H136v40h16a8,8,0,0,1,0,16H104a8,8,0,0,1,0-16h16V120H96a8,8,0,0,1,0-16h64A8,8,0,0,1,168,112Z"/>
    </svg>
  </button>
</div>

<div id="a11y-panel" role="dialog" aria-modal="true" aria-label="תפריט נגישות" tabindex="-1">
  <div id="a11y-panel-header">
    <button id="a11y-close" aria-label="סגור תפריט נגישות">
      <svg xmlns="http://w3.org" width="22" height="22" fill="white" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
    </button>
    <h2>תפריט נגישות</h2>
  </div>

  <div class="a11y-section">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 10px 0; direction: rtl;">התאמות תצוגה וניגודיות</h3>
    <div class="a11y-grid">
      <button class="a11y-btn" data-feature="contrast-bright">ניגודיות בהירה</button>

      <button class="a11y-btn" data-feature="mono">מונוכרום</button>
      <button class="a11y-btn" data-feature="stop-anim">עצירת אנימציות</button>
    </div>
  </div>

  <div style="height: 1px; background: #eee; margin: 4px 16px;"></div>

  <div class="a11y-section">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 10px 0; direction: rtl;">גופנים וקריאה</h3>

      <span class="a11y-slider-label">גודל גופן</span>

  <div class="a11y-section">

      <button class="a11y-btn" data-feature="reading-guide">מדריך קריאה</button>

      <button class="a11y-btn" data-feature="voice-nav">פקודות קוליות</button>
    </div>
    <button id="a11y-reset-all" style="width:100%; margin-top:14px; padding:10px; background:#fff5f5; border:1.5px solid #fca5a5; border-radius:10px; color:#e02020; font-weight:900; font-size:13px; cursor:pointer;">

<!-- רכיב הקראת הטקסט (TTS) -->

  <div style="max-width:600px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;">

    <button id="tts-stop-btn" style="background:#e02020; color:white; border:none; padding:4px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">עצור הקראה</button>
  </div>
</div>

<!-- JavaScript Logic -->
<script>
  window.addEventListener('load', function() {
    const fab = document.getElementById('a11y-fab');
    const panel = document.getElementById('a11y-panel');
    const closeBtn = document.getElementById('a11y-close');
    const body = document.body;

    if (!fab || !panel || !closeBtn) return;

    // פתיחה וסגירה בטוחה של הפאנל הצידי
    fab.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      panel.classList.toggle('open');
      const isOpen = panel.classList.contains('open');
      fab.setAttribute('aria-expanded', isOpen);
    });

    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      panel.classList.remove('open');
      fab.setAttribute('aria-expanded', 'false');
    });

    // מניעת סגירה כאשר לוחצים בתוך הפאנל
    panel.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    // סגירה בלחיצה מחוץ לפאנל
    document.addEventListener('click', function() {
      panel.classList.remove('open');
      fab.setAttribute('aria-expanded', 'false');
    });

    // מפת היכולות
    const featureMap = {
