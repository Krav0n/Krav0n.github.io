<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הקישורים של Krav0n</title>
    <!-- טעינת אייקונים של FontAwesome בצורה תקינה כדי שהלוגואים יוצגו -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0014; /* רקע כהה מאוד כמו בתמונה */
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 65vh; /* דוחף את התוכן למטה עוד יותר ב-20% נוספים מהפעם הקודמת */
        }

        /* עיצוב תמונת פרופיל חלק */
        .profile-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
        }
        /* הדגשת נגישות לתמונת הפרופיל בעת ניווט מקלדת */
        .profile-link:focus {
            outline: 3px solid #53fc18;
            border-radius: 50%;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px; /* רווח קבוע בין כפתורים */
        }

        /* סגנון כללי לכפתורים בדיוק כמו בתמונה */
        .link-card {
            border-radius: 14px; /* פינות מעוגלות רחבות */
            padding: 18px;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* רווח בין הטקסט לאייקון */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .link-card:hover {
            transform: scale(1.02); /* הגדלה קלה ברחיפה */
            opacity: 0.92;
        }

        /* נגישות מקלדת: סימון ברור של הכפתור הממוקד הנוכחי */
        .link-card:focus {
            outline: 4px solid #ffffff;
            transform: scale(1.02);
            opacity: 1;
        }

        /* צבעים ורקעים ייחודיים לכל כפתור לפי התמונה */
        .btn-kick {
            background-color: #53fc18;
            color: #000000; /* טקסט שחור ב-Kick לניגודיות */
        }

        .btn-discord {
            background: linear-gradient(to right, #4051b5, #5865f2);
        }

        .btn-youtube {
            background: linear-gradient(to right, #ba0000, #e60000);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #8a3ab9, #e95950, #fccc63);
        }
    </style>
</head>
<body>

    <!-- תגית main מגדירה את האזור המרכזי עבור קוראי מסך -->
    <main class="container">
        
        <!-- תמונת פרופיל לחיצה ונגישה שמובילה לקיק שלכם -->
        <a href="https://kick.com/krav0n" target="_blank" class="profile-link" aria-label="תמונת פרופיל - מעבר לערוץ ה-Kick של Krav0n">
            <img src="https://placeholder.com" alt="תמונת הפרופיל הרשמית של Krav0n" class="profile-img">
        </a>

        <!-- תגית nav מציינת לקורא המסך שמדובר בתפריט קישורי ניווט -->
        <nav class="links-container" aria-label="קישורים חברתיים">
            
            <!-- 1. כפתור Kick נגיש -->
            <a href="https://kick.com/krav0n" target="_blank" class="link-card btn-kick" aria-label="מעבר לערוץ ה-Kick הרשמי של Krav0n">
                Kick <i class="fa-solid fa-k" aria-hidden="true"></i>
            </a>

            <!-- 2. כפתור Discord נגיש -->
            <a href="https://discord.com/invite/RsyXzy4G8n" target="_blank" class="link-card btn-discord" aria-label="הצטרפות לשרת ה-Discord של Krav0n">
                Discord <i class="fab fa-discord" aria-hidden="true"></i>
            </a>

            <!-- 3. כפתור YouTube נגיש -->
            <a href="https://www.youtube.com/@Krav0n5" target="_blank" class="link-card btn-youtube" aria-label="מעבר לערוץ ה-YouTube של Krav0n">
                YouTube <i class="fab fa-youtube" aria-hidden="true"></i>
            </a>

            <!-- 4. כפתור Instagram נגיש -->
            <a href="https://www.instagram.com/krav0n.5/" target="_blank" class="link-card btn-instagram" aria-label="מעבר לעמוד ה-Instagram של Krav0n">
                Instagram <i class="fab fa-instagram" aria-hidden="true"></i>
            </a>

        </nav>

    </main>

</body>
</html>
