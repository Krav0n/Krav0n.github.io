<!-- תפריט נגישות מלא ומתוקן ב-100% -->
<style>
  /* ==================== ACCESSIBILITY WIDGET STYLES ==================== */
  #a11y-widget-container { position: fixed; bottom: 80px; left: 0; z-index: 99998; direction: rtl; }
  #a11y-fab { width: 52px; height: 52px; background: #e02020; color: white; border: none; border-radius: 0 10px 10px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 15px rgba(0,0,0,0.4); transition: all 0.2s; }
  #a11y-fab:hover { background: #c01010; width: 58px; }
  #a11y-panel { position: fixed; bottom: 0; left: -420px; top: 0; width: 420px; max-width: 95vw; background: #fff; color: #222; z-index: 99999; transition: left 0.35s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; box-shadow: 5px 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
  #a11y-panel.open { left: 0 !important; }
  #a11y-panel-header { background: #e02020; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2; flex-shrink: 0; }
  #a11y-panel-header h2 { font-size: 17px; font-weight: 900; margin: 0; direction: rtl; }
  #a11y-close { background: none; border: none; color: white; cursor: pointer; padding: 4px; border-radius: 6px; display: flex; align-items: center; }
  #a11y-close:hover { background: rgba(255,255,255,0.2); }
  .a11y-section { padding: 14px 16px 8px; text-align: right; }
  .a11y-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .a11y-btn { background: #fff; border: 1.5px solid #ddd; border-radius: 10px; padding: 12px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #333; font-weight: 700; text-align: center; transition: all 0.15s; font-family: sans-serif; line-height: 1.3; min-height: 70px; justify-content: center; width: 100%; }
  .a11y-btn:hover { border-color: #e02020; color: #e02020; background: #fff5f5; }
  .a11y-btn.active { border-color: #e02020 !important; background: #fff0f0 !important; color: #e02020 !important; box-shadow: 0 0 0 2px rgba(224,32,32,0.2) !important; }
  #reading-guide-bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: rgba(0,0,0,0.3); pointer-events: none; z-index: 99990; display: none; border-top: 2px solid #e02020; border-bottom: 2px solid #e02020; }
  .a11y-slider-row { display: flex; align-items: center; gap: 10px; direction: rtl; padding: 8px 0; }
  .a11y-slider-row input[type=range] { flex: 1; accent-color: #e02020; }
  .a11y-slider-label { font-size: 12px; font-weight: 700; color: #555; white-space: nowrap; }

  /* BODY MODIFIERS */
  body.a11y-stop-anim * { animation: none !important; transition: none !important; }
  body.a11y-large-text { font-size: 120% !important; }
  body.a11y-high-contrast { filter: contrast(150%) brightness(1.1); }
  body.a11y-dark-contrast { filter: invert(1) hue-rotate(180deg); }
  body.a11y-mono { filter: grayscale(1); }
  body.a11y-highlight-links a { background: yellow !important; color: #000 !important; padding: 0 2px !important; outline: 2px solid orange !important; }
  body.a11y-readable-font * { font-family: 'Arial', sans-serif !important; letter-spacing: 0.05em !important; }
  body.a11y-big-cursor * { cursor: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='32' height='32' viewBox='0 0 32 32'%3E%3Cpath d='M8 0 L8 24 L14 18 L20 32 L23 31 L17 17 L26 17 Z' fill='black' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E") 8 0, auto !important; }
  .a11y-focus-visible :focus { outline: 3px solid #e02020 !important; outline-offset: 3px !important; }
</style>

<!-- HTML Structure -->
<div id="a11y-widget-container" role="region" aria-label="תפריט נגישות">
  <button id="a11y-fab" aria-label="פתח תפריט נגישות" aria-expanded="false" aria-controls="a11y-panel">
    <svg xmlns="http://w3.org" width="28" height="28" fill="white" viewBox="0 0 256 256" aria-hidden="true">
      <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM128,56a16,16,0,1,0,16,16A16,16,0,0,0,128,56Zm40,56a8,8,0,0,1-8,8H136v40h16a8,8,0,0,1,0,16H104a8,8,0,0,1,0-16h16V120H96a8,8,0,0,1,0-16h64A8,8,0,0,1,168,112Z"/>
    </svg>
  </button>
</div>

<div id="a11y-panel" role="dialog" aria-modal="true" aria-label="תפריט נגישות" tabindex="-1">
  <div id="a11y-panel-header">
    <button id="a11y-close" aria-label="סגור תפריט נגישות">
      <svg xmlns="http://w3.org" width="22" height="22" fill="white" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
    </button>
    <h2>תפריט נגישות</h2>
  </div>

  <div class="a11y-section">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 10px 0; direction: rtl;">התאמות תצוגה וניגודיות</h3>
    <div class="a11y-grid">
      <button class="a11y-btn" data-feature="contrast-bright">ניגודיות בהירה</button>
      <button class="a11y-btn" data-feature="contrast-dark">ניגודיות כהה</button>
      <button class="a11y-btn" data-feature="mono">מונוכרום</button>
      <button class="a11y-btn" data-feature="stop-anim">עצירת אנימציות</button>
    </div>
  </div>

  <div style="height: 1px; background: #eee; margin: 4px 16px;"></div>

  <div class="a11y-section">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 10px 0; direction: rtl;">גופנים וקריאה</h3>
    <div class="a11y-slider-row">
      <span class="a11y-slider-label">גודל גופן</span>
      <input type="range" min="80" max="160" value="100" id="font-size-slider">
      <span class="a11y-slider-label" id="font-size-display">100%</span>
    </div>
    <div class="a11y-grid">
      <button class="a11y-btn" data-feature="readable-font">גופן קריא</button>
      <button class="a11y-btn" data-feature="highlight-links">הדגשת קישורים</button>
    </div>
  </div>

  <div style="height: 1px; background: #eee; margin: 4px 16px;"></div>

  <div class="a11y-section">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 10px 0; direction: rtl;">כלים נוספים</h3>
    <div class="a11y-grid">
      <button class="a11y-btn" data-feature="reading-guide">מדריך קריאה</button>
      <button class="a11y-btn" data-feature="big-cursor">סמן גדול</button>
      <button class="a11y-btn" data-feature="tts-read">הקראת עמוד</button>
      <button class="a11y-btn" data-feature="voice-nav">פקודות קוליות</button>
    </div>
    <button id="a11y-reset-all" style="width:100%; margin-top:14px; padding:10px; background:#fff5f5; border:1.5px solid #fca5a5; border-radius:10px; color:#e02020; font-weight:900; font-size:13px; cursor:pointer;">
      ← איפוס כל ההגדרות
    </button>
  </div>
</div>

<div id="reading-guide-bar" aria-hidden="true"></div>

<!-- רכיב הקראת הטקסט (TTS) -->
<div id="tts-bar" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#1e293b; color:white; border-top:2px solid #e02020; z-index:99994; padding:10px 16px; direction:rtl;">
  <div style="max-width:600px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;">
    <span style="font-size:13px;">🔊 מקריא כעת את תוכן האתר...</span>
    <button id="tts-stop-btn" style="background:#e02020; color:white; border:none; padding:4px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">עצור הקראה</button>
  </div>
</div>

<!-- JavaScript Logic -->
<script>
  (function() {
    const fab = document.getElementById('a11y-fab');
    const panel = document.getElementById('a11y-panel');
    const closeBtn = document.getElementById('a11y-close');
    const body = document.body;

    if (!fab || !panel || !closeBtn) return;

    // הפעלה וסגירה בטוחה של הפאנל הצידי
    fab.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.classList.toggle('open');
      const isOpen = panel.classList.contains('open');
      fab.setAttribute('aria-expanded', isOpen);
    });

    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.classList.remove('open');
      fab.setAttribute('aria-expanded', 'false');
    });

    // מניעת סגירה כאשר לוחצים בתוך הפאנל
    panel.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    // סגירה בלחיצה מחוץ לפאנל
    document.addEventListener('click', function() {
      panel.classList.remove('open');
      fab.setAttribute('aria-expanded', 'false');
    });

    // מפת היכולות
    const featureMap = {
      'contrast-bright': function() { body.classList.toggle('a11y-high-contrast'); body.classList.remove('a11y-dark-contrast','a11y-mono'); },
      'contrast-dark': function() { body.classList.toggle('a11y-dark-contrast'); body.classList.remove('a11y-high-contrast','a11y-mono'); },
      'mono': function() { body.classList.toggle('a11y-mono'); body.classList.remove('a11y-high-contrast','a11y-dark-contrast'); },
      'stop-anim': function() { body.classList.toggle('a11y-stop-anim'); },
      'readable-font': function() { body.classList.toggle('a11y-readable-font'); },
      'highlight-links': function() { body.classList.toggle('a11y-highlight-links'); },
      'big-cursor': function() { body.classList.toggle('a11y-big-cursor'); },
      'reading-guide': toggleReadingGuide,
      'tts-read': toggleTTS,
      'voice-nav': toggleVoiceNav
    };

    document.querySelectorAll('.a11y-btn[data-feature]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const f = btn.dataset.feature;
        if (featureMap[f]) { featureMap[f](); }
        
        // עדכון מצב אקטיבי עבור פיצ'רים שאינם הקראה/פקודות קוליות
        if (f !== 'tts-read' && f !== 'voice-nav') {
          btn.classList.toggle('active');
        }
      });
    });

    // מדריך קריאה
