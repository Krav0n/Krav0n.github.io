<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krav0n Links</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .profile-container {
            text-align: center;
            margin-top: 40px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ffcc00;
            object-fit: cover;
        }
        .profile-name {
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .link-btn:hover {
            transform: scale(1.02);
        }
        .kick { background-color: #53fc18; color: black; }
        .discord { background-color: #5865f2; }
        .youtube { background-color: #ff0000; }
        .instagram { background-color: #e1306c; }
        .footer {
            font-size: 14px;
            color: #888888;
            margin-bottom: 20px;
        }
        .footer span {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- פרופיל -->
    <div class="profile-container">
        <!-- החלף את קישור התמונה בשלך במידת הצורך -->
        <img class="profile-img" src="https://unsplash.com" alt="Krav0n Profile">
        <div class="profile-name">Krav0n</div>
    </div>

    <!-- כפתורי קישורים -->
    <div class="links-container">
        <a href="#" class="link-btn kick">Kick</a>
        <a href="#" class="link-btn discord">Discord</a>
        <a href="#" class="link-btn youtube">YouTube</a>
        <a href="#" class="link-btn instagram">Instagram</a>
    </div>

    <!-- קרדיט תחתון -->
    <div class="footer">
        Made by <span>Krav0n</span>
    </div>

</body>
</html>
